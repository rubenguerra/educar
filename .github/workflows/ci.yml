name: Django CI/CD Pipeline

# El pipeline se ejecutará automáticamente en estos eventos:
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. Descargar el código del repositorio en la máquina virtual
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Instalar la versión correcta de Python
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13' # Asegúrate de que coincida con tu versión de desarrollo

    # 3. Cachear las dependencias para que las ejecuciones futuras sean ultra rápidas
    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # 4. Instalar las librerías del proyecto
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 5. Ejecutar la batería de pruebas automatizadas
    # Inyectamos variables de entorno ficticias obligatorias para que los tests corran sin problemas
    - name: Run Tests
      env:
        SECRET_KEY: "github-actions-super-secret-key-for-testing-purposes"
        DEBUG: "True"
        OPENAI_API_KEY: "sk-proj-mock-key-for-github-actions"
      run: |
        python manage.py test chat students
