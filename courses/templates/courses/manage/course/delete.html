{% extends 'base.html' %}

{% block title %}Eliminar curso{% endblock %}

{% block content %}
<h1>Eliminar curso {{ object.title }}</h1>

<div class="module">
    <form action="" method="post">
        {% csrf_token %}
        <p>¿Estás seguro de querer eliminar "{{ object }}"?</p>
        <input type="submit" value="Confirm">
    </form>
</div>
{% endblock %}
